name: sql

on:
  issues:
    types: [opened]

# Read-only: this workflow never writes to the repo. It only replies on the issue it was
# triggered by. The query is untrusted, so it only ever travels in an env var.
env:
  PYTHONDONTWRITEBYTECODE: "1"

permissions:
  contents: read
  issues: write

jobs:
  query:
    if: startsWith(github.event.issue.title, 'sql:')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run query in the read-only sandbox
        env:
          QUERY: ${{ github.event.issue.title }}
        run: python3 scripts/sqlbot.py --out "$RUNNER_TEMP/reply.md"

      - name: Reply and close
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE" --body-file "$RUNNER_TEMP/reply.md"
          gh issue close "$ISSUE" --reason completed
